# Tests use PostgreSQL; configure DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/rksolutions_test}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false


# JWT for tests
app.jwt.secret=test_secret_key_for_jwt_tokens_minimum_256_bits_long_enough
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000
