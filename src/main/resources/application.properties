server.port=8080

spring.application.name=rksolutions

# Database - PostgreSQL (override these environment variables for your local database)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/rksolutions}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# JWT
app.jwt.secret=rksolutions_super_secret_key_2024_change_in_production_environment_minimum_256_bits
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Mail (optional)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
