# Production profile for Render.deployment
server.port=10000

# File-based H2 persistence (persists to /data volume in Render)
spring.datasource.url=jdbc:h2:file:/data/rksolutions_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

# H2 Console (disabled in production)
spring.h2.console.enabled=false

# JWT
app.jwt.secret=${JWT_SECRET:rksolutions_super_secret_key_2024_change_in_production_environment_minimum_256_bits}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# Swagger (enabled in production for convenience)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging
logging.level.org.springframework=INFO
logging.level.com.rksolutions=INFO
